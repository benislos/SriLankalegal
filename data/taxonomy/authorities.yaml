  - {id: ACT-POCA-2025, title: "Proceeds of Crime Act, No. 5 of 2025 (passed 8 Apr 2025; certified 30 Apr 2025)", status: in_force, verification_status: corroborated, sources: [SRC-0014, SRC-0015]}
  - {id: ACT-HRCSL-1996, title: "Human Rights Commission of Sri Lanka Act, No. 21 of 1996", status: in_force, verification_status: corroborated, sources: [SRC-0026]}
