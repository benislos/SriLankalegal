cases:
  # ---- Privy Council / Soulbury era (historical binding, now persuasive) ----
  - {id: CASE-LIYANAGE-1965, name: "Liyanage v The Queen", citation: "(1965) 68 NLR 265 (PC); [1967] 1 AC 259", court: "Privy Council", year: 1965, authority_weight: binding_pc_historical, verification_status: corroborated, sources: [SRC-0020], point: "Implied separation of judicial power under the Soulbury Constitution; ad hominem retroactive legislation directed at pending trials usurped judicial power.", notes: "Judgment date given variously as 1965/1966."}
  - {id: CASE-RANASINGHE-1964, name: "Bribery Commissioner v Ranasinghe", citation: "(1964) 66 NLR 73 (PC); [1965] AC 172", court: "Privy Council", year: 1964, authority_weight: binding_pc_historical, verification_status: unverified, point: "Legislature must comply with manner-and-form requirements of the Constitution; appointment of judicial officers."}
  - {id: CASE-IBRALEBBE-1963, name: "Ibralebbe v The Queen", citation: "(1963) 65 NLR 433 (PC); [1964] AC 900", court: "Privy Council", year: 1963, authority_weight: binding_pc_historical, verification_status: unverified, point: "Retention of Privy Council appeals compatible with Ceylon's sovereignty."}
  - {id: CASE-KODAKAN-PILLAI-1953, name: "Kodakan Pillai v Mudanayake", citation: "(1953) 54 NLR 433 (PC)", court: "Privy Council", year: 1953, authority_weight: binding_pc_historical, verification_status: unverified, point: "Citizenship legislation and s.29 Soulbury Constitution (minority protection) - disenfranchisement of Indian Tamils upheld."}
  # ---- Supreme Court: constitutional structure ----
  - {id: CASE-RE-13A-1987, name: "In re the Thirteenth Amendment to the Constitution and the Provincial Councils Bill", citation: "[1987] 2 Sri LR 312", court: "Supreme Court", year: 1987, authority_weight: binding_sc, verification_status: corroborated, sources: [SRC-0036], point: "Neither the 13th Amendment Bill nor the PC Bill required a referendum under Art 83; devolution held compatible with the unitary State. Ranasinghe J would have required a referendum for cl. 154G(2)(b) and (3)(b) (sub-clause lettering varies across sources)."}
  - {id: CASE-RE-19A-2002, name: "In re the Nineteenth Amendment to the Constitution (2002 Bill)", citation: "[2002] 3 Sri LR 85", court: "Supreme Court", year: 2002, authority_weight: binding_sc, verification_status: corroborated, sources: [SRC-0037], point: "Art 3 read with Art 4: transfer, relinquishment or removal of a power of one organ to another is inconsistent with sovereignty; clauses inconsistent with Art 4(b) required a referendum. Breadth disputed: whether every Art 4 inconsistency attracts a referendum (Verite) - contested."}
  - {id: CASE-SAMPANTHAN-2018, name: "Sampanthan v Attorney General (Dissolution case)", citation: "SC FR 351/2018 (and connected), decided 13 Dec 2018", court: "Supreme Court (7 judges)", year: 2018, authority_weight: binding_sc, verification_status: corroborated, sources: [SRC-0022], point: "Presidential power of dissolution under Art 33(2)(c) is subject to Art 70; proclamation dissolving Parliament quashed; justiciability of presidential acts via Art 35 proviso."}
  - {id: CASE-MALLIKARACHCHI-1985, name: "Mallikarachchi v Shiva Pasupati, Attorney General", citation: "[1985] 1 Sri LR 74", court: "Supreme Court", year: 1985, authority_weight: binding_sc, verification_status: unverified, point: "Absolute presidential immunity under the original Art 35 (pre-19A position)."}
  - {id: CASE-KARUNATHILAKA-1999, name: "Karunathilaka v Dayananda Dissanayake, Commissioner of Elections", citation: "[1999] 1 Sri LR 157 (SC App 509/98); enforcement order [1999] 1 Sri LR 183", court: "Supreme Court", year: 1999, authority_weight: binding_sc, verification_status: corroborated, sources: [SRC-0033], point: "Postponement of provincial council elections violated Art 12(1)/14(1)(a); Art 35 immunity is personal and does not shield the act of others."}
  - {id: CASE-PREMACHANDRA-1994, name: "Premachandra v Major Montague Jayawickrema (Provincial Governors' case)", citation: "[1994] 2 Sri LR 90", court: "Supreme Court", year: 1994, authority_weight: binding_sc, verification_status: corroborated, sources: [SRC-0019], point: "There are no absolute or unfettered discretions in public law; powers are held in trust for the public; Governors' discretion in appointing Chief Ministers is reviewable."}
  - {id: CASE-DISSANAYAKE-KALEEL-1993, name: "Dissanayake v Kaleel", citation: "[1993] 2 Sri LR 135", court: "Supreme Court", year: 1993, authority_weight: binding_sc, verification_status: unverified, point: "Expulsion of MPs from party; Art 99(13)(a) review; natural justice in party disciplinary process."}
  # ---- Fundamental rights ----
  - {id: CASE-VELMURUGU-1981, name: "Velmurugu v Attorney General", citation: "[1981] 1 Sri LR 406", court: "Supreme Court", year: 1981, authority_weight: binding_sc, verification_status: unverified, point: "Early Art 11 torture case; standard of proof (high degree of probability) - note strong dissent of Sharvananda J."}
  - {id: CASE-SRIYANI-SILVA-2003, name: "Sriyani Silva v Iddamalgoda, OIC Paiyagala Police", citation: "SC (FR) 471/2000, decided 8 Aug 2003; reported [2003] 2 Sri LR 63 (volume to confirm)", court: "Supreme Court", year: 2003, authority_weight: binding_sc, verification_status: corroborated, sources: [SRC-0017], point: "Death in police custody: implied right to life read from Arts 11/13(4); heirs/dependants may invoke Art 126 by purposive construction of Art 126(2)."}
  - {id: CASE-SAMAN-LEELADASA-1989, name: "Saman v Leeladasa", citation: "[1989] 1 Sri LR 1 (SC App 4/88)", court: "Supreme Court", year: 1989, authority_weight: binding_sc, verification_status: corroborated, sources: [SRC-0035], notes: "Precise holding on officer vs State liability not visible in search records - confirm from text.", point: "State liability for FR infringements by officers (executive or administrative action) even if act not authorised."}
  - {id: CASE-CHANNA-PEIRIS-1994, name: "Channa Pieris v Attorney General (Ratawesi Peramuna case)", citation: "[1994] 1 Sri LR 1", court: "Supreme Court", year: 1994, authority_weight: binding_sc, verification_status: unverified, point: "Arrest and detention under emergency regulations; reasonable suspicion; Art 13(1)."}
  - {id: CASE-WICKREMABANDU-1990, name: "Wickremabandu v Herath", citation: "[1990] 2 Sri LR 348", court: "Supreme Court", year: 1990, authority_weight: binding_sc, verification_status: unverified, point: "Review of preventive detention orders under emergency regulations; limits of subjective satisfaction."}
  - {id: CASE-JOSEPH-PERERA-1992, name: "Joseph Perera v Attorney General", citation: "[1992] 1 Sri LR 199 (SC 107-109/86)", court: "Supreme Court", year: 1992, authority_weight: binding_sc, verification_status: corroborated, sources: [SRC-0034], point: "Emergency Regulation 28 (police permission for leaflets/posters) ultra vires the Public Security Ordinance; arrests illegal; freedom of speech not absolute but presidential opinion of necessity does not alone validate a regulation."}
  - {id: CASE-VISUVALINGAM-1983, name: "Visuvalingam v Liyanage", citation: "Citation to confirm (reported 1983/1984 Sri LR)", court: "Supreme Court", year: 1983, authority_weight: binding_sc, verification_status: requires_investigation, point: "Freedom of expression includes the right of readers to receive information (closure of the 'Saturday Review')."}
  - {id: CASE-FERNANDO-SLBC-1996, name: "Fernando v Sri Lanka Broadcasting Corporation", citation: "[1996] 1 Sri LR 157", court: "Supreme Court", year: 1996, authority_weight: binding_sc, verification_status: unverified, point: "Freedom of speech does not include a free-standing right to information (pre-Art 14A position)."}
  - {id: CASE-FAIZ-1995, name: "Faiz v Attorney General", citation: "[1995] 1 Sri LR 372 (SC App 89/91)", court: "Supreme Court", year: 1995, authority_weight: binding_sc, verification_status: corroborated, sources: [SRC-0032], point: "Arrest, detention and ill-treatment by police held violative of Arts 11/13(1)/13(2) (corroborated). The proposition that private acts done with State authority, connivance or acquiescence are executive action is attributed to this case from memory - UNVERIFIED, confirm from text."}
  - {id: CASE-GUNARATNE-PB-1986, name: "Gunaratne v People's Bank", citation: "[1986] 1 Sri LR 338", court: "Supreme Court", year: 1986, authority_weight: binding_sc, verification_status: unverified, point: "Freedom of association (Art 14(1)(d)) includes freedom not to associate."}
  - {id: CASE-SOMAWATHIE-1990, name: "Somawathie v Weerasinghe", citation: "[1990] 2 Sri LR 121", court: "Supreme Court", year: 1990, authority_weight: binding_sc, verification_status: unverified, point: "Strict standing under Art 126(2) (application by wife on behalf of detained husband) - later qualified by Sriyani Silva."}
  - {id: CASE-WICKRAMATUNGA-1998, name: "Wickrematunga v Ratwatte", citation: "[1998] 1 Sri LR 201", court: "Supreme Court", year: 1998, authority_weight: binding_sc, verification_status: unverified, point: "Art 12(1) and arbitrariness in public administration (political considerations)."}
  - {id: CASE-SENARATH-2007, name: "Senarath v Chandrika Kumaratunga", citation: "[2007] 1 Sri LR 59", court: "Supreme Court", year: 2007, authority_weight: binding_sc, verification_status: unverified, point: "Misuse of public funds / public trust; personal liability and the limits of presidential immunity after leaving office."}
  - {id: CASE-KEHELIYA-2026, name: "Transparency International Sri Lanka v Rambukwella (immunoglobulin procurement case)", citation: "SC FR (number to confirm), decided March 2026", court: "Supreme Court", year: 2026, authority_weight: binding_sc, verification_status: requires_investigation, sources: [SRC-0028], point: "Reported: former Health Minister and officials personally liable (Rs. 275 Mn) for Art 12(1) violation in procurement."}
  - {id: CASE-SEAGULL-2026, name: "Seagull Property Developers FR case", citation: "SC FR (number to confirm), decided 30 Mar 2026", court: "Supreme Court", year: 2026, authority_weight: binding_sc, verification_status: requires_investigation, sources: [SRC-0029], point: "Reported (single commentary) as extending Art 126 relief to private developers - characterisation unverified."}
  # ---- Administrative law and public trust ----
  - {id: CASE-BULANKULAMA-2000, name: "Bulankulama v Secretary, Ministry of Industrial Development (Eppawela case)", citation: "SC (FR) 884/99; [2000] 3 Sri LR 243", court: "Supreme Court", year: 2000, authority_weight: binding_sc, verification_status: corroborated, sources: [SRC-0018], point: "Imminent infringement of FR by proposed phosphate mining agreement; public trust doctrine, sustainable development, precautionary principle, intergenerational equity."}
  - {id: CASE-BANDARA-1994, name: "Bandara v Premachandra", citation: "[1994] 1 Sri LR 301", court: "Supreme Court", year: 1994, authority_weight: binding_sc, verification_status: corroborated, sources: [SRC-0019], point: "Cited as an early articulation of the public trust doctrine in public administration."}
  - {id: CASE-SUGATHAPALA-2008, name: "Sugathapala Mendis v Chandrika Kumaratunga (Waters Edge case)", citation: "[2008] 2 Sri LR 339", court: "Supreme Court", year: 2008, authority_weight: binding_sc, verification_status: unverified, point: "Alienation of public land for private benefit; public trust doctrine; Art 12(1)."}
  - {id: CASE-NANAYAKKARA-CHOKSY-2008, name: "Vasudeva Nanayakkara v Choksy (John Keells / Lanka Marine Services case)", citation: "[2008] 1 Sri LR (page to confirm)", court: "Supreme Court", year: 2008, authority_weight: binding_sc, verification_status: corroborated, sources: [SRC-0019], point: "Privatisation of state assets; public trust; Art 12(1)."}
  - {id: CASE-EFL-UDA-2009, name: "Environmental Foundation Ltd v Urban Development Authority (Galle Face Green case)", citation: "[2009] 1 Sri LR 123", court: "Supreme Court", year: 2009, authority_weight: binding_sc, verification_status: unverified, point: "Public trust; right of access to information recognised as implicit in Art 14(1)(a) (pre-14A)."}
  - {id: CASE-MUNDY-2004, name: "Heather Therese Mundy v Central Environmental Authority (Southern Expressway case)", citation: "SC Appeal 58/2003 (and connected), decided 20 Jan 2004", court: "Supreme Court", year: 2004, authority_weight: binding_sc, verification_status: unverified, point: "Natural justice owed to affected landowners when route altered post-EIA; compensation; procedural fairness in development decisions."}
  - {id: CASE-SINGARASA-2006, name: "Nallaratnam Singarasa v Attorney General", citation: "SC Spl (LA) 182/99, decided 15 Sep 2006", court: "Supreme Court", year: 2006, authority_weight: binding_sc, verification_status: corroborated, sources: [SRC-0021], point: "Dualism: ICCPR binding internationally but not domestically enforceable without legislation; accession to ICCPR-OP1 by President unconstitutional."}
  - {id: CASE-MUDANAYAKE-1951, name: "Mudanayake v Sivagnanasunderam", citation: "(1951) 53 NLR 25", court: "Supreme Court of Ceylon", year: 1951, authority_weight: persuasive_lk, verification_status: unverified, point: "Citizenship legislation and Soulbury s.29 (decided before Kodakan Pillai PC)."}
  # ---- Comparative (persuasive) ----
  - {id: CASE-WEDNESBURY-1948, name: "Associated Provincial Picture Houses Ltd v Wednesbury Corporation", citation: "[1948] 1 KB 223", court: "Court of Appeal (England & Wales)", year: 1948, authority_weight: persuasive_comparative, verification_status: unverified, point: "Unreasonableness so great that no reasonable authority could have come to it."}
  - {id: CASE-GCHQ-1985, name: "Council of Civil Service Unions v Minister for the Civil Service (GCHQ)", citation: "[1985] AC 374", court: "House of Lords", year: 1984, authority_weight: persuasive_comparative, verification_status: unverified, point: "Grounds of review: illegality, irrationality, procedural impropriety (proportionality anticipated); legitimate expectation."}
  - {id: CASE-RIDGE-1964, name: "Ridge v Baldwin", citation: "[1964] AC 40", court: "House of Lords", year: 1963, authority_weight: persuasive_comparative, verification_status: unverified, point: "Revival of natural justice in administrative decisions affecting rights."}
  - {id: CASE-ANISMINIC-1969, name: "Anisminic Ltd v Foreign Compensation Commission", citation: "[1969] 2 AC 147", court: "House of Lords", year: 1968, authority_weight: persuasive_comparative, verification_status: unverified, point: "Errors of law go to jurisdiction; ouster clauses do not protect nullities."}
  - {id: CASE-PADFIELD-1968, name: "Padfield v Minister of Agriculture, Fisheries and Food", citation: "[1968] AC 997", court: "House of Lords", year: 1968, authority_weight: persuasive_comparative, verification_status: unverified, point: "Discretion must be used to promote the policy and objects of the statute."}
  - {id: CASE-KESAVANANDA-1973, name: "Kesavananda Bharati v State of Kerala", citation: "(1973) 4 SCC 225", court: "Supreme Court of India", year: 1973, authority_weight: persuasive_comparative, verification_status: unverified, point: "Basic structure doctrine - comparative point for Sri Lankan debates on implied limits to amendment."}
  - {id: CASE-MANEKA-1978, name: "Maneka Gandhi v Union of India", citation: "(1978) 1 SCC 248", court: "Supreme Court of India", year: 1978, authority_weight: persuasive_comparative, verification_status: unverified, point: "Procedure established by law must be fair, just and reasonable; interrelation of rights."}

