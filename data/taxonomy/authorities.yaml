  - {id: BILL-PSFT-2026, title: "Protection of the State from Terrorism Bill (gazetted 22 Sep 2026; tabled 6 Oct 2026)", status: bill_pending, verification_status: corroborated, sources: [SRC-0008, SRC-0009, SRC-0010], notes: "Name varies in reporting ('Safeguarding the State from Terrorism'). Reported SC determination (~12-13 Nov 2026) requiring amendments - single-outlet report, requires_investigation."}
