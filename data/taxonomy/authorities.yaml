# AUTHORITIES REGISTER (Taxonomy Level 4 pointers)
# These are Phase-1 *pointer records*: enough to identify an authority and anchor the taxonomy.
# Full case profiles (facts, ratio, obiter, treatment) and full statute records (amendment history,
# provisions) are built in Phase 2 and MUST NOT be inferred from these pointers.
#
# verification_status (see docs/VERIFICATION_FRAMEWORK.md):
#   verified_primary       - official/reproduced full text read and the recorded details checked against it
#   corroborated           - existence, citation and core point corroborated this project by a primary-host
#                            record (seen via search index) or >=2 independent secondary sources; text not read
#   unverified             - from researcher knowledge; NOT yet checked in this project. Do not cite onward.
#   requires_investigation - conflicting information, doubtful citation, or status in flux
#
# authority_weight (for cases): binding_sc | binding_pc_historical | persuasive_lk | persuasive_comparative
# status (for legislation): in_force | in_force_amended | repealed | bill_pending | requires_verification

constitutional_provisions:
  # The 1978 Constitution as amended. Amendment numbers flagged where they changed a provision.
  # NOTE: the official consolidated text (parliament.lk) could not be fetched in session 1; article
  # subject-matter below is from researcher knowledge unless marked corroborated.
  - {id: CP-1978, title: 'Constitution of the Democratic Socialist Republic of Sri Lanka, 1978 (as amended to the 22nd Amendment, 2026)', verification_status: corroborated, sources: [SRC-0004, SRC-0006, SRC-0030, SRC-0038, SRC-0039, SRC-0040, SRC-0041], as_of: '2026-11-19', notes: 'Official consolidated text read: Parliament Revised Edition 2023, as amended up to 31 Oct 2022 (21A). The 22nd Amendment (passed and certified 25 Sep 2026) is not in any consolidated text found; its Act text is still to be read. Whole-document status stays corroborated until a consolidation incl. 22A is read.'}
  - {id: CP-ART-001-002, title: 'Arts 1-2 - Free, Sovereign, Independent and Democratic Socialist Republic; Unitary State', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: '22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-003, title: 'Art 3 - Sovereignty is in the People and is inalienable (includes powers of government, fundamental rights and the franchise)', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: '22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-004, title: 'Art 4 - Manner of exercise of sovereignty (legislative, executive, judicial power; fundamental rights; franchise)', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'Art 4(c): judicial power exercised by Parliament through courts, tribunals and institutions, save parliamentary privilege. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-009, title: 'Art 9 - Foremost place to Buddhism, subject to Arts 10 and 14(1)(e)', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: '22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-010, title: 'Art 10 - Freedom of thought, conscience and religion', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'Not listed in any paragraph of Art 15 (no permissible restrictions). 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-011, title: 'Art 11 - Freedom from torture and cruel, inhuman or degrading treatment or punishment (not subject to Art 15 restrictions)', verification_status: verified_primary, sources: [SRC-0017, SRC-0038], as_of: '2022-10-31', notes: 'Confirmed: Art 15 restricts Arts 12, 13(1),(2),(5),(6) and 14 only. Art 11 is also entrenched by Art 83(a). 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-012, title: Art 12 - Right to equality; equal protection of the law; non-discrimination; affirmative action (12(4)), verification_status: verified_primary, sources: [SRC-0028, SRC-0038], as_of: '2022-10-31', notes: '12(4) permits special provision for the advancement of women, children or disabled persons. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-013, title: 'Art 13 - Freedom from arbitrary arrest, detention and punishment; fair trial; presumption of innocence; non-retroactivity; 13(4) no death/imprisonment except by court order', verification_status: verified_primary, sources: [SRC-0017, SRC-0038], as_of: '2022-10-31', notes: '22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-014, title: 'Art 14 - Freedoms of speech and expression, assembly, association, trade union, religion, culture and language, occupation, movement and residence, return to Sri Lanka', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: '14(1)(a)-(i); (i) is the freedom to return to Sri Lanka. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-014A, title: 'Art 14A - Right of access to information (inserted by 19th Amendment, 2015)', verification_status: verified_primary, sources: [SRC-0023, SRC-0038], as_of: '2022-10-31', notes: '22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-015, title: 'Art 15 - Permissible restrictions on fundamental rights (national security, public order, racial/religious harmony, etc.)', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: '15(7) general restriction applies to Arts 12, 13(1), 13(2) and 14 only; Arts 10, 11, 13(3), 13(4) are not restrictable. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-016, title: Art 16 - Existing written and unwritten law valid notwithstanding inconsistency with Chapter III, verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: '22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-017, title: Art 17 - Entitlement to apply to the Supreme Court under Art 126, verification_status: verified_primary, sources: [SRC-0017, SRC-0038], as_of: '2022-10-31', notes: 'Covers infringement or imminent infringement by executive or administrative action. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-018-025, title: Chapter IV (Arts 18-25A) - Official and national languages; language rights, verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'Art 18: Sinhala official language, Tamil also official (13A), English link language. Art 19: Sinhala and Tamil national languages. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-027-029, title: Chapter VI (Arts 27-29) - Directive Principles of State Policy and Fundamental Duties (Art 28); Art 29 non-justiciability, verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: '22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-030-041, title: 'Chapter VII (Arts 30-41) - The President: election, term, powers, immunity (Art 35)', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'Art 33A (responsibility to Parliament) repealed by 20A s.4; Art 42 now carries that responsibility. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-033, title: Art 33 - Powers and functions of the President (single list (a)-(h) as substituted by 20A s.3; no dissolution power here), verification_status: verified_primary, sources: [SRC-0022, SRC-0038], as_of: '2022-10-31', notes: 'CORRECTION: the earlier title cited 33(2)(c) (summon, prorogue, dissolve Parliament). That was the 19A structure. The current Art 33 (substituted by 20A) is one list (a)-(h); summoning, prorogation and dissolution are now only in Art 70(1). Sampanthan (2018) construed the 19A-era text. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-035, title: Art 35 - Immunity of the President from suit; proviso permitting Art 126 applications against the Attorney-General in respect of official acts (survives 20A/21A), verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'RESOLVED: Art 35 as substituted by 20A s.5 keeps the proviso allowing Art 126 applications against the AG for the President''s official acts; a further proviso excludes the President''s power under Art 33(g) (declaring war and peace). Art 35(3) exceptions retained. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-041A-041J, title: 'Chapter VIIA - Constitutional Council (substituted by 21st Amendment, 2022) and Independent Commissions (Schedule to Art 41B)', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'RESOLVED: 10 members - PM, Speaker (Chairman), Leader of the Opposition, one MP appointed by the President, five nominees (one government MP, one opposition-party MP, three persons nominated by the Speaker with PM and LoO agreement), and one MP from other parties. Schedule: Election, Public Service, National Police, Audit Service, Human Rights, Bribery/Corruption, Finance, Delimitation and National Procurement Commissions. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-042-053, title: Chapter VIII - Cabinet of Ministers; collective responsibility to Parliament, verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'Art 42: President responsible to Parliament; Art 43(2): Cabinet collectively responsible. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-054-061, title: Chapter IX (Arts 54-61F) - Public Service; Public Service Commission; Art 61A ouster of courts (save Arts 59 and 126), verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'Correction: Art 61A ouster is subject to Art 59 (Administrative Appeals Tribunal) as well as Art 126. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-062-074, title: 'Chapters X-XI - Parliament: composition, term, sessions, dissolution (Art 70), Standing Orders, privileges (Art 67)', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'Chapter X = Arts 62-69; Chapter XI = Arts 70-81. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-070, title: 'Art 70 - Summoning, prorogation and dissolution of Parliament (no dissolution within 2 years 6 months of first meeting unless Parliament requests by resolution)', verification_status: verified_primary, sources: [SRC-0022, SRC-0038], as_of: '2022-10-31', notes: 'Art 70(1) substituted by 20A s.12: bar is 2 years 6 months. Under 19A it was 4 years 6 months - the text construed in Sampanthan (2018). 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-075-080, title: 'Chapter XI - Legislative power: Art 75 (law-making), Art 76 (no abdication; delegated legislation), Art 80(3) (no inquiry into validity of Act after certification)', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'CORRECTION: these Articles are in Chapter XI (Arts 70-81), not Chapter XII. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-082-084, title: 'Chapter XII - Amendment of the Constitution: Art 82 procedure, Art 83 entrenched provisions requiring referendum, Art 84 inconsistent Bills', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'RESOLVED: Art 83(a) entrenches Arts 1, 2, 3, 6, 7, 8, 9, 10, 11 and Art 83 itself; Art 83(b) entrenches Arts 30(2) and 62(2) against extension of the presidential or parliamentary term beyond six years. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-085-087, title: Chapter XIII - The Referendum, verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: '22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-088-104, title: Chapters XIV/XIVA - Franchise and elections (Arts 88-102); Election Commission (Arts 103-104J), verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: '22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-105-117, title: 'Chapters XV-XVA - The Judiciary (Arts 105-111C: courts, independence, appointment and removal of judges, Art 107) and Judicial Service Commission (Arts 111D-117)', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'CORRECTION: the JSC is in Chapter XVA, not Chapter XV. Art 107 amended by 22A (2026) - see CP-ART-107.'}
  - {id: CP-ART-107, title: 'Art 107 - Appointment, tenure and removal of judges of SC/CA (retirement ages amended by 22nd Amendment, 2026: SC 67, CA 65; six-year term limit for Chief Justice)', verification_status: corroborated, sources: [SRC-0005, SRC-0006, SRC-0038, SRC-0039, SRC-0040, SRC-0041], as_of: '2026-11-19', notes: 'Arts 107(1)-(4) read in the 2022 text: appointment by President subject to Constitutional Council approval (21A s.12); removal on address by majority of all MPs for proved misbehaviour or incapacity. 107(5) in that text: SC 65, CA 63. 22A (passed and certified 25 Sep 2026) raises these to 67 and 65. The SC determination required a proviso in Clause 2 exempting the sitting Chief Justice from the six-year term limit. 22A also amends Art 137 (Court of Appeal judges 19 to 24). The 22A Act text is not yet read, so this stays corroborated.'}
  - {id: CP-ART-118-134, title: 'Chapter XVI (The Superior Courts) - The Supreme Court: jurisdictions (constitutional, FR, appellate, consultative, election petitions, breach of privileges)', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'Art 118(a)-(g) confirmed. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-120-124, title: 'Arts 120-124 - Pre-enactment constitutional review of Bills; 14-day petition window (Art 121, 21A); urgent Bills limited to national security and disaster management (Art 122, 20A); bar on other review (Art 124)', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'RESOLVED: Art 121(1) window is 14 days from placement on the Order Paper (substituted by 21A s.17); determination within three weeks. Art 122 (inserted by 20A s.26, retained after 21A): Cabinet-certified urgent Bills on national security or disaster management only; SC determination within 24 hours (up to 3 days); not for constitutional amendments. Art 124 bars any other review of Bills. Confirmed in practice by the 22A procedure (SRC-0004). 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-125, title: Art 125 - Exclusive jurisdiction of SC on interpretation of the Constitution (references from lower courts), verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: '22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-126, title: Art 126 - Sole and exclusive FR jurisdiction of the SC; executive or administrative action; one-month time limit; leave to proceed; just and equitable relief, verification_status: verified_primary, sources: [SRC-0017, SRC-0018, SRC-0038], as_of: '2022-10-31', notes: 'Extends to language rights in Chapter IV. 126(2): one month, leave to proceed by at least two judges; 126(3) reference from CA writ proceedings; 126(5) disposal within two months. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-129, title: Art 129 - Consultative jurisdiction of the SC (references by the President), verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: '22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-138-147, title: 'Chapter XVI - Court of Appeal: appellate and revisionary jurisdiction (Art 138), writs (Art 140), habeas corpus (Art 141)', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'CORRECTION: the Court of Appeal provisions are in Chapter XVI (Arts 118-147), not Chapter XVII (Finance). Art 137 (composition) amended by 22A (2026).'}
  - {id: CP-ART-140, title: 'Art 140 - Writ jurisdiction of the Court of Appeal (certiorari, prohibition, mandamus, procedendo, quo warranto)', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'Proviso (1st Amendment s.2): Parliament may by law vest specified categories in the Supreme Court. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-141, title: Art 141 - Habeas corpus jurisdiction of the Court of Appeal, verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: '22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-148-154, title: 'Chapter XVII - Finance: parliamentary control of public finance (Art 148), Consolidated Fund (Art 149), Auditor-General (Arts 153-154)', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'Auditor-General appointed by President subject to Constitutional Council approval (21A). 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-154A-154T, title: 'Chapter XVIIA - Provincial Councils (13th Amendment, 1987); Ninth Schedule: Provincial, Reserved and Concurrent Lists', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: '22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-154P, title: 'Art 154P - High Court of the Province: criminal, appellate, revisionary and writ jurisdiction (154P(4))', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: '154P(4)(b) writs only against persons exercising power within the Province under any law or provincial statute on a Provincial Council List matter. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-155, title: 'Art 155 - Public Security: emergency regulations under the Public Security Ordinance; parliamentary approval', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'Proclamation lapses after 14 days unless approved by Parliament; regulations may override any law except the Constitution. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-155A-155T, title: Chapter XVIIIA (Arts 155A-155N) - National Police Commission, verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'CORRECTION: Chapter XVIIIA covers only the National Police Commission (Arts 155A-155N). The Election Commission is Chapter XIVA (Arts 103-104J); the Parliamentary Commissioner is Ch XIX (Art 156); the Bribery Commission Ch XIXA (Art 156A); the National Procurement Commission Ch XIXB (Arts 156B-156H). The record id is kept stable. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-157, title: Art 157 - Treaties for the promotion and protection of foreign investment, verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'Requires a two-thirds resolution; such treaty then has force of law. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-157A, title: 'Art 157A - Prohibition on advocacy of a separate State (6th Amendment, 1983)', verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: 'Inserted by 6th Amendment s.3. 22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}
  - {id: CP-ART-168, title: Art 168 - Continuance of existing laws, verification_status: verified_primary, sources: [SRC-0038], as_of: '2022-10-31', notes: '22A (2026) does not touch this provision per parliament.lk summaries (SRC-0039, SRC-0041).'}

amendments:
  - {id: AMD-06, title: "Sixth Amendment to the Constitution (1983) - Art 157A, oath against separatism", year: 1983, verification_status: unverified}
  - {id: AMD-13, title: "Thirteenth Amendment to the Constitution (1987) - Provincial Councils, Tamil as official language", year: 1987, verification_status: unverified}
  - {id: AMD-17, title: "Seventeenth Amendment (2001) - Constitutional Council and independent commissions", year: 2001, verification_status: unverified}
  - {id: AMD-18, title: "Eighteenth Amendment (2010) - removed presidential term limit; Parliamentary Council replaced Constitutional Council", year: 2010, verification_status: unverified}
  - {id: AMD-19, title: "Nineteenth Amendment (2015) - restored term limits and Constitutional Council; Art 14A; Art 35 proviso", year: 2015, verification_status: unverified}
  - {id: AMD-20, title: "Twentieth Amendment (2020) - re-expanded presidential power; Parliamentary Council", year: 2020, verification_status: unverified}
  - {id: AMD-21, title: "Twenty-First Amendment (2022) - restored Constitutional Council and independence of commissions", year: 2022, verification_status: corroborated, sources: [SRC-0030]}
  - {id: AMD-22, title: 'Twenty-Second Amendment (2026) - retirement age of SC judges 65->67, CA judges 63->65; six-year term limit for the Chief Justice (sitting CJ exempted); Art 137 amended (CA judges 19->24); passed 25 Sep 2026 (158-63) and certified the same day; SC determined no referendum required', year: 2026, verification_status: corroborated, sources: [SRC-0004, SRC-0005, SRC-0006, SRC-0007, SRC-0039, SRC-0040, SRC-0041], as_of: '2026-11-19', notes: Certification date confirmed by parliament.lk (Speaker endorsed 25 Sep 2026). Committee-stage amendments to Clause 2 followed the SC determination. The Act text (and its number) has not been read; documents.gov.lk now serves a client-rendered app whose document routes could not be found.}

legislation:
  - {id: ACT-JUDICATURE-1978, title: 'Judicature Act, No. 2 of 1978', status: in_force_amended, verification_status: unverified, notes: 'Amended by Judicature (Amendment) Act, No. 23 of 2026 (see ACT-JUDICATURE-AMD-2026).'}
