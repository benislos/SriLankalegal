# SOURCE REGISTER
# Every source consulted during research is logged here with an ID.
# source_class (per Research Integrity Framework, docs/VERIFICATION_FRAMEWORK.md):
#   primary_official   - official legislation, gazette, court judgment hosted by state/court
#   primary_reproduced - judgment/Act text reproduced by a non-official host (LawNet mirrors, ADB, UMN)
#   secondary_scholarly- journals, theses, books, institutional analysis
#   secondary_news     - newspapers, news sites, blogs
#   ngo_ig             - NGO / intergovernmental organisation publications
# accessed_via: how the source was reached in a given session. "search_index" means only the
#   search-engine record/snippet was seen, NOT the full document. This matters: a search snippet
#   corroborates, it does not verify the text of a provision or a ratio.

sources:
