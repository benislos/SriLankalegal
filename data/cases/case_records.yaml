  citation: 'SC (FR) 471/2000: [2003] 1 Sri LR 14 (preliminary objections, 10 Dec 2002) and [2003] 2 Sri LR 63 (merits, 8
    Aug 2003)'
  verification_note: 'RESOLVED citation conflict: there are TWO reported judgments in SC 471/2000, not two variant citations.
    (1) [2003] 1 Sri LR 14, decided 10 Dec 2002 (S. N. Silva CJ, Bandaranayake J, Edussuriya J dissenting): preliminary objections
    overruled - the deceased acquired a right to redress; where death is causally linked to the infringement anyone with a
    legitimate interest (here the widow) may prosecute it under Art 126(2); the original petition was in time; Somawathie
    v Weerasinghe distinguished. (2) [2003] 2 Sri LR 63, decided 8 Aug 2003 (Fernando J): Arts 11 and 13(4) imply a right
    to life; Art 126(2) read broadly with Art 4(d); Art 17 is an independent fundamental right; Arts 11, 13(2), 17 infringed.
    Rs 800,000 compensation and costs to the widow and minor child (Rs 700,000 from the State, Rs 50,000 each from the 1st
    and 2nd respondents personally).'
