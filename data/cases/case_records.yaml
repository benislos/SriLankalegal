- id: CASE-SRIYANI-SILVA-2003
  application_no: SC (FR) Application No. 471/2000
  decided_on: '2003-08-08'
  bench:
  - Fernando J
  - Yapa J
  - J. A. N. de Silva J
  material_facts: 'The petitioner''s husband, an army deserter, was arrested by Paiyagala police on 12 June 2000, assaulted
    in custody, produced before the Magistrate on 17 June, remanded, and died in Welikada remand prison on 20 June 2000 (post-mortem:
    twenty injuries; acute renal failure due to muscular trauma). The petition filed on his behalf was amended to substitute
    the widow.'
  legal_issues:
  - Does the Constitution protect a right to life though not expressly enumerated?
  - May heirs/dependants invoke Art 126 when the victim has died?
  decision: 'Preliminary objections overruled ([2003] 1 Sri LR 14, 10 Dec 2002, Edussuriya J dissenting). On the merits ([2003]
    2 Sri LR 63, 8 Aug 2003): Arts 11, 13(2) and 17 infringed by the 2nd respondent and by the 1st respondent (failure to
    supervise); Rs 800,000 compensation and costs to the widow and minor child - Rs 700,000 by the State and Rs 50,000 each
    by the 1st and 2nd respondents personally.'
  ratio: 'Arts 11 and 13(4) by necessary implication recognise the right to life; where a person dies through torture or unlawful
    executive action, Art 126(2) read with Art 4(d) is construed broadly so that the right is not illusory - the deceased''s
    rights devolve on the heirs/dependants, and the Art 17 entitlement is itself an independent fundamental right. ([2003]
    1 Sri LR 14: where death is causally linked to the infringement, anyone with a legitimate interest may prosecute the deceased''s
    acquired right.)'
  obiter: []
  principles:
  - Implied right to life
  - Standing of heirs/dependants
  - Purposive construction of Art 126(2)
  subsequent_treatment: Followed widely on standing of heirs (e.g. 2019 and 2021 SC FR judgments); qualifies the strict approach
    in Somawathie v Weerasinghe (to verify).
  field_status:
    decision: verified_primary
    ratio: verified_primary
    citation: verified_primary
