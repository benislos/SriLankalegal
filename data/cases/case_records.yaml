- id: CASE-SINGARASA-2006
  application_no: SC Spl (LA) 182/99
  decided_on: 2006-09-15
  bench:
  - S.N. Silva CJ (presiding) - full bench to verify
  material_facts: Singarasa, convicted largely on a confession under the PTA, obtained a UN Human Rights Committee view that
    his ICCPR rights were violated, and sought revision of his conviction in reliance on it.
  legal_issues:
  - Are ICCPR obligations and Human Rights Committee views enforceable in Sri Lankan courts?
  - Was the President's accession to the First Optional Protocol constitutional?
  decision: Application dismissed; accession to the Optional Protocol held unconstitutional and without legal effect domestically.
  ratio: The ICCPR binds Sri Lanka internationally but creates no domestically justiciable rights without enabling legislation;
    the President's accession to OP1 was an impermissible exercise of legislative and judicial power.
  obiter: []
  principles:
  - Dualism
  - Treaty-making as executive act requiring legislation for domestic effect
  subsequent_treatment: Prompted the ICCPR Act 2007 and a 2008 SC advisory opinion (to verify); widely criticised (e.g. that
    OP1 validity was not argued).
  field_status:
    material_facts: unverified
    decision: corroborated
    ratio: corroborated
    bench: unverified
  edges: []
- id: CASE-SAMPANTHAN-2018
  application_no: SC FR 351/2018 (and 352-361/2018)
  decided_on: 2018-12-13
  bench:
  - Nalin Perera CJ (presiding) - 7-judge bench
  material_facts: On 9 November 2018 President Sirisena issued a proclamation dissolving Parliament less than four and a half
    years after its first sitting, in the midst of the October 2018 constitutional crisis.
  legal_issues:
  - Does Art 33(2)(c) confer a dissolution power independent of Art 70?
  - Is the proclamation justiciable in FR proceedings against the AG?
  decision: Proclamation declared void ab initio; FR (Art 12(1)) infringed. Unanimous.
  ratio: The President's power to dissolve Parliament must be exercised in conformity with Art 70 as amended, which bars dissolution
    before four and a half years absent a parliamentary resolution.
  obiter: []
  principles:
  - Constitution read as a whole
  - Justiciability of presidential acts after 19A
  subsequent_treatment: pending
  field_status:
    ratio: corroborated
    decision: corroborated
