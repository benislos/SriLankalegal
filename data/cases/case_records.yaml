  - id: CASE-BULANKULAMA-2000
    application_no: "SC (FR) 884/99"
    bench: []
    material_facts: "Residents of the Eppawela area challenged a proposed mineral investment agreement between the State and a foreign company for large-scale phosphate mining, which would displace residents and affect land, water and archaeological sites."
    legal_issues:
      - "Can a proposed (not yet concluded) agreement amount to an imminent infringement of fundamental rights?"
      - "What is the State's responsibility in disposing of natural resources?"
    decision: "Imminent infringement of the petitioners' fundamental rights established; the State directed to desist from entering into the agreement until environmental and other legal requirements were met."
    ratio: "Natural resources are held by the State in trust for the People; disposal must comply with environmental law and principles of sustainable development, and a proposed agreement threatening rights can be restrained as an imminent infringement."
    obiter: ["Reference to international environmental principles (precautionary principle, intergenerational equity) as guides though not binding instruments."]
    principles: ["Public trust over natural resources", "Sustainable development", "Precautionary principle", "Intergenerational equity", "Imminent infringement under Art 126"]
    subsequent_treatment: "Cited in later SC decisions on public trust (2008 judgment; Azath Salley v CMC [2009] 1 Sri LR) - details pending."
    field_status: {material_facts: corroborated, decision: corroborated, ratio: corroborated, obiter: unverified}
    edges:
      - {to: CASE-PREMACHANDRA-1994, type: CITES, basis: judicial, note: "Public trust lineage - confirm citation in text", sources: []}

  - id: CASE-SRIYANI-SILVA-2003
    application_no: "SC (FR) 471/2000"
    decided_on: 2003-08-08
    bench: ["Fernando J", "Yapa J", "J.A.N. de Silva J"]
    material_facts: "The petitioner's husband was arrested by Paiyagala police, allegedly tortured in custody, and died. His widow petitioned on his behalf."
    legal_issues:
      - "Does the Constitution protect a right to life though not expressly enumerated?"
      - "May heirs/dependants invoke Art 126 when the victim has died?"
    decision: "Infringement of fundamental rights declared; compensation awarded (amounts pending)."
    ratio: "Art 126(2) is construed purposively so that the lawful heirs and/or dependants of a person who died as a result of torture or unlawful executive action may bring the complaint; Arts 11 and 13(4) imply protection of the right to life."
    obiter: []
    principles: ["Implied right to life", "Standing of heirs/dependants", "Purposive construction of Art 126(2)"]
    subsequent_treatment: "Followed widely on standing of heirs (e.g. 2019 and 2021 SC FR judgments); qualifies the strict approach in Somawathie v Weerasinghe (to verify)."
    field_status: {decision: unverified, ratio: corroborated, citation: requires_investigation}
    edges:
      - {to: CASE-SOMAWATHIE-1990, type: QUALIFIES, basis: suggested, note: "Widened standing beyond Somawathie - verify whether expressly discussed", sources: []}

  - id: CASE-SINGARASA-2006
    application_no: "SC Spl (LA) 182/99"
    decided_on: 2006-09-15
    bench: ["S.N. Silva CJ (presiding) - full bench to verify"]
    material_facts: "Singarasa, convicted largely on a confession under the PTA, obtained a UN Human Rights Committee view that his ICCPR rights were violated, and sought revision of his conviction in reliance on it."
    legal_issues:
      - "Are ICCPR obligations and Human Rights Committee views enforceable in Sri Lankan courts?"
      - "Was the President's accession to the First Optional Protocol constitutional?"
    decision: "Application dismissed; accession to the Optional Protocol held unconstitutional and without legal effect domestically."
    ratio: "The ICCPR binds Sri Lanka internationally but creates no domestically justiciable rights without enabling legislation; the President's accession to OP1 was an impermissible exercise of legislative and judicial power."
    obiter: []
    principles: ["Dualism", "Treaty-making as executive act requiring legislation for domestic effect"]
    subsequent_treatment: "Prompted the ICCPR Act 2007 and a 2008 SC advisory opinion (to verify); widely criticised (e.g. that OP1 validity was not argued)."
    field_status: {material_facts: unverified, decision: corroborated, ratio: corroborated, bench: unverified}
    edges: []

  - id: CASE-SAMPANTHAN-2018
    application_no: "SC FR 351/2018 (and 352-361/2018)"
    decided_on: 2018-12-13
    bench: ["Nalin Perera CJ (presiding) - 7-judge bench"]
    material_facts: "On 9 November 2018 President Sirisena issued a proclamation dissolving Parliament less than four and a half years after its first sitting, in the midst of the October 2018 constitutional crisis."
    legal_issues:
      - "Does Art 33(2)(c) confer a dissolution power independent of Art 70?"
      - "Is the proclamation justiciable in FR proceedings against the AG?"
    decision: "Proclamation declared void ab initio; FR (Art 12(1)) infringed. Unanimous."
    ratio: "The President's power to dissolve Parliament must be exercised in conformity with Art 70 as amended, which bars dissolution before four and a half years absent a parliamentary resolution."
    obiter: []
    principles: ["Constitution read as a whole", "Justiciability of presidential acts after 19A"]
    subsequent_treatment: pending
    field_status: {ratio: corroborated, decision: corroborated}
    edges: []

  - id: CASE-RE-13A-1987
    application_no: "SC Determinations on the 13th Amendment Bill and Provincial Councils Bill"
    bench: ["Sharvananda CJ et al. - split bench to verify"]
    material_facts: "Following the Indo-Lanka Accord (July 1987), the Thirteenth Amendment Bill and Provincial Councils Bill were challenged under Art 121 as requiring a referendum because they would alter the unitary State."
    legal_issues:
      - "Does devolution to provincial councils violate the unitary State (Art 2) or sovereignty (Art 3), so requiring a referendum under Art 83?"
    decision: "Neither Bill required approval at a referendum (majority view); Ranasinghe J would have required a referendum for parts of clause 154G."
    ratio: "Devolution within the framework of a unitary constitution, with Parliament retaining supremacy and the centre retaining control, does not alter the unitary character of the State."
    obiter: []
    principles: ["Devolution compatible with unitary State"]
    subsequent_treatment: "Treated as settling that 13A devolution is within a unitary framework (CPA Working Paper 1)."
    field_status: {ratio: corroborated, bench: unverified}
    edges: []

  - id: CASE-RE-19A-2002
    application_no: "SC Determination(s) on the Nineteenth Amendment to the Constitution Bill (2002)"
    bench: []
    material_facts: "A 2002 Bill to amend the Constitution (appointment of PM, dissolution of Cabinet and related matters) was challenged under Art 121(1)."
    legal_issues:
      - "Does reallocation of executive powers between organs require a referendum under Arts 3, 4 and 83?"
    decision: "Clauses inconsistent with Art 4(b) required approval at a referendum; substituted clauses could pass by special majority under Art 84(2)."
    ratio: "Art 3 read with Art 4: transfer, relinquishment or removal of a power attributed to one organ of government to another organ or body is inconsistent with the sovereignty of the People."
    obiter: []
    principles: ["Balance of power", "Sovereignty includes powers of government"]
    subsequent_treatment: "Central to 2015 19A Bill determination and later amendment Bills; breadth contested by commentators."
    field_status: {ratio: corroborated, decision: corroborated}
    edges:
      - {to: CASE-RE-13A-1987, type: RELATED_TO, basis: academic, note: "Both define referendum thresholds under Art 83", sources: []}

  - id: CASE-KARUNATHILAKA-1999
    application_no: "SC App 509/98"
    bench: []
    material_facts: "Elections to five provincial councils were postponed by the Commissioner of Elections acting under emergency regulations; voters and candidates challenged the postponement."
    legal_issues:
      - "Does Art 35 (presidential immunity) oust FR jurisdiction where the postponement flowed from presidential emergency regulations?"
      - "Does postponement infringe Arts 12(1) and 14(1)(a)?"
    decision: "Postponement held unlawful; the Commissioner directed (27 Jan 1999) to fix a new date; a later order ([1999] 1 Sri LR 183, 16 Mar 1999) required a date by 27 Apr 1999."
    ratio: "Art 35 prohibits only the institution of proceedings against the President personally while in office; it does not oust the Court's Art 126 jurisdiction over the acts of others, including acts done under presidential regulations."
    obiter: []
    principles: ["Limits of presidential immunity", "Franchise and freedom of expression", "Court may enforce its FR judgments"]
    subsequent_treatment: pending
    field_status: {ratio: corroborated, decision: corroborated, material_facts: unverified}
    edges:
      - {to: CASE-MALLIKARACHCHI-1985, type: DISTINGUISHES, basis: suggested, note: "Confines immunity to the President personally - verify express treatment", sources: []}

  - id: CASE-JOSEPH-PERERA-1992
    application_no: "SC 107-109/86"
    bench: []
    material_facts: "The petitioner, an organiser of the 'Young Socialist' and member of the Revolutionary Communist League, was arrested for distributing leaflets without police permission required by Emergency Regulation 28 (1986)."
    legal_issues:
      - "Was Regulation 28 ultra vires the Public Security Ordinance and inconsistent with Art 14(1)(a)?"
      - "Were the arrests lawful?"
    decision: "Regulation 28(1) held ultra vires; arrests illegal; regulation subsequently replaced."
    ratio: "Emergency regulations are reviewable for consistency with the Constitution; a restriction on speech is not validated merely by the President's opinion that it is necessary."
    obiter: ["Freedom of speech is the natural right of a free society to impart and acquire information, though not absolute."]
    principles: ["Reviewability of emergency regulations", "Freedom of speech and restrictions"]
    subsequent_treatment: "Cited in Karunathilaka (1999) and Saranapala v Solangaarachchi (1999)."
    field_status: {ratio: corroborated, decision: corroborated, obiter: corroborated}
    edges:
      - {to: CASE-KARUNATHILAKA-1999, type: INFLUENCES, basis: judicial, note: "Cited in Karunathilaka", sources: [SRC-0034]}

