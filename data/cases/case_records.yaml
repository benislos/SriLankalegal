- id: CASE-KARUNATHILAKA-1999
  application_no: S.C. Application No. 509/98
  bench:
  - G. P. S. de Silva CJ
  - Fernando J
  - Gunasekera J
  material_facts: Five Provincial Councils' terms ended in June 1998; nominations closed on 15 July 1998 and the poll was
    fixed for 28 Aug 1998. Postal voting was suspended on 3 Aug 1998, and on 4 Aug the President brought Part II of the Public
    Security Ordinance into operation and made an emergency regulation cancelling the poll. The Commissioner then took no
    steps to fix a fresh date.
  legal_issues:
  - Does Art 35 (presidential immunity) oust FR jurisdiction where the postponement flowed from presidential emergency regulations?
  - Does postponement infringe Arts 12(1) and 14(1)(a)?
  decision: Postponement held unlawful; the Commissioner directed (27 Jan 1999) to fix a new date; a later order ([1999] 1
    Sri LR 183, 16 Mar 1999) required a date by 27 Apr 1999.
  ratio: Art 35 prohibits only the institution of proceedings against the President personally while in office; it does not
    oust the Court's Art 126 jurisdiction over the acts of others, including acts done under presidential regulations.
  obiter: []
  principles:
  - Limits of presidential immunity
  - Franchise and freedom of expression
  - Court may enforce its FR judgments
  subsequent_treatment: pending
  field_status:
    ratio: verified_primary
    decision: verified_primary
    material_facts: verified_primary
    application_no: verified_primary
    decided_on: verified_primary
    bench: verified_primary
  edges:
  - to: CASE-MALLIKARACHCHI-1985
    type: DISTINGUISHES
    basis: suggested
    note: Confines immunity to the President personally - verify express treatment
    sources: []
  decided_on: '1999-01-27'
  verification_note: 'Main judgment 27 Jan 1999 ([1999] 1 Sri LR 157): proclamation and emergency regulation cancelling the
    poll were executive action; Art 35 does not oust Art 126 over acts of others relying on presidential acts; ouster in s.8
    PSO no bar; regulation not for a s.5 PSO purpose; Arts 12(1) and 14(1)(a) infringed (voting is expression). Enforcement
    judgment 16 Mar 1999 ([1999] 1 Sri LR 183): Commissioner to fix a poll date not later than 27 Apr 1999.'
  text_sources:
  - SRC-0051
  - SRC-0052
- id: CASE-JOSEPH-PERERA-1992
  application_no: S.C. Applications Nos. 107/86, 108/86 and 109/86
  bench:
  - Sharvananda CJ
  - Wanasundera J
  - Atukorale J
  - L. H. de Alwis J
  - Seneviratne J
  material_facts: The petitioner, an organiser of the 'Young Socialist' and member of the Revolutionary Communist League,
    was arrested for distributing leaflets without police permission required by Emergency Regulation 28 (1986).
  legal_issues:
  - Was Regulation 28 ultra vires the Public Security Ordinance and inconsistent with Art 14(1)(a)?
  - Were the arrests lawful?
  decision: 'Emergency Regulation 28 held invalid (violating Arts 14(1)(a) and 12). Majority (Sharvananda CJ and Atukorale
    J dissenting on this point): the arrests were not illegal, and detention was unlawful only from 15.7.1986. Rs 10,000 compensation
    payable by the State (decided 25 May 1987).'
  ratio: Prior restraint of expression bears a heavy burden of justification; a system of pre-censorship conferring unguided
    and unfettered discretion on an executive authority is unconstitutional, and a restriction with no rational or proximate
    nexus to national security or public order is not saved by Art 15. The lawfulness of an arrest turns on the arresting
    officer's knowledge and state of mind at the time.
  obiter:
  - Freedom of speech is the natural right of a free society to impart and acquire information, though not absolute.
  principles:
  - Reviewability of emergency regulations
  - Freedom of speech and restrictions
  subsequent_treatment: Cited in Karunathilaka (1999) and Saranapala v Solangaarachchi (1999).
  field_status:
    ratio: verified_primary
    decision: verified_primary
    obiter: verified_primary
    material_facts: corroborated
    application_no: verified_primary
    decided_on: verified_primary
    bench: verified_primary
