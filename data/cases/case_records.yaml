- id: CASE-LIYANAGE-1965
  application_no: Privy Council Appeal No. 23 of 1965 (from Trial-at-Bar No. 2 of 1962)
  bench:
  - Lord MacDermott
  - Lord Morris of Borth-y-Gest
  - Lord Guest
  - Lord Pearce
  - Lord Pearson
  material_facts: After the abortive coup of January 1962, Parliament enacted the Criminal Law (Special Provisions) Act 1962,
    applying retrospectively to the accused, altering rules of evidence, arrest and punishment, and providing for trial by
    judges nominated by the Minister of Justice. The appellants were convicted by a Supreme Court bench constituted under
    the Act.
  legal_issues:
  - Did the Soulbury Constitution, though silent, vest judicial power exclusively in the judicature?
  - Was legislation directed at the particular accused in pending proceedings a usurpation of judicial power?
  decision: Convictions quashed; the impugned legislation was ultra vires as an interference with judicial power.
  ratio: The structure of the Constitution implies a separation of judicial power; legislation that is ad hominem and designed
    to secure the conviction of particular persons in pending proceedings usurps that power and is invalid.
  obiter: []
  principles:
  - Implied separation of powers
  - Judicial power cannot be usurped by legislature or executive
  subsequent_treatment: Relied on by Ceylon courts to hold that executive officers cannot exercise judicial power; foundational
    to S-CON-03.
  field_status:
    material_facts: corroborated
    ratio: verified_primary
    application_no: verified_primary
    decision: verified_primary
    decided_on: verified_primary
    bench: verified_primary
  edges: []
  decided_on: '1965-12-02'
  verification_note: 'RESOLVED date conflict: delivered 2 Dec 1965 by Lord Pearce; reported 68 NLR 265. Appeals allowed, convictions
    quashed. Headnote: Part 6 of the Soulbury Constitution shows an intention to keep judicial power in the judicature; an
    Act usurping it without recourse to s.29(4) is ultra vires. The AC citation was not checked (foreign report).'
  text_sources:
  - SRC-0042
- id: CASE-PREMACHANDRA-1994
  application_no: S.C. Reference Nos. 2/93-5/93 (Art 125 references from C.A. Application Nos. 376/93-379/93)
  bench:
  - G. P. S. de Silva CJ
  - Bandaranayake J
  - Fernando J
  material_facts: After the 17 May 1993 North-Western and Southern Provincial Council elections no party had a majority; the
    Governors appointed the UNP contenders as Chief Ministers over rival DUNF/PEP claimants. Quo warranto, certiorari and
    mandamus applications in the Court of Appeal led to references under Arts 125 and 126(3).
  legal_issues:
  - Is the Governor's power to appoint a Chief Minister under Art 154F an unreviewable discretion?
  decision: 'The Art 126(3) reference was improper (not of the whole matter); the Art 125 questions were answered: the Governor''s
    Art 154F(4) discretion is not purely subjective, is justiciable, and is reviewable by the Court of Appeal for unreasonableness,
    bad faith, disregard of relevant evidence, irrelevant considerations or no evidence (Order of the Court, 16 Aug 1993).'
  ratio: Every power has legal limits however wide the empowering language; there are no absolute or unfettered discretions
    in public law, and powers are held in trust for the public.
  obiter: []
  principles:
  - No unfettered discretion
  - Public trust in exercise of public power
  subsequent_treatment: Cited in later SC decisions on public trust (e.g. alongside Bulankulama in a 2008 judgment) and at
    pp. 101-102 for discretion.
  field_status:
    decision: verified_primary
    ratio: verified_primary
    material_facts: verified_primary
    application_no: verified_primary
    decided_on: verified_primary
    bench: verified_primary
  edges: []
  decided_on: '1993-08-16'
  verification_note: 'Order of the Court delivered 16 Aug 1993 (reported 1994). The Art 126(3) reference was held improper;
    only the Art 125 questions were answered. Answers: Art 154F(4) discretion not purely subjective, justiciable, reviewable
    by the CA for unreasonableness, bad faith, irrelevant considerations or no evidence.'
  text_sources:
  - SRC-0050
- id: CASE-BANDARA-1994
  application_no: S.C. Application No. 213/93
  bench:
  - Fernando J
  - Perera J
  - Wijetunga J
  material_facts: Probationer survey trainees (Surveyor-General's Department) joined a union work-to-rule campaign and tendered
    sick notes; vacation-of-post notices were served and services terminated. Reinstatement was offered only on an undertaking
    not to take part in trade-union activity during the four-year training period.
  legal_issues:
  - Was termination on account of trade-union activity, and did it violate Art 12?
  decision: Termination was on account of trade-union activity; the alleged misconduct had to be dealt with under the Establishments
    Code; Art 12 infringed and relief ordered.
  ratio: Termination of public-service probationers for participating in trade-union activity, bypassing the disciplinary
    procedure in the Establishments Code, is arbitrary and violates Art 12.
  obiter: []
  principles:
  - Art 12 and public-service discipline
  - Trade-union activity
  subsequent_treatment: pending
  field_status:
    ratio: verified_primary
    material_facts: verified_primary
    decision: verified_primary
    application_no: verified_primary
    decided_on: verified_primary
    bench: verified_primary
  edges: []
  decided_on: '1993-08-16'
  verification_note: 'MAJOR CORRECTION: the record cited this case as ''an early articulation of the public trust doctrine''.
    The reported judgment ([1994] 1 Sri LR 301) contains no public-trust reasoning. It is an Art 12 / trade-union termination
    case. Its links as key authority for the public-trust doctrines (T-CON-03-04, T-ADM-01-03, S-ADM-01) have been removed.
    Decided 16 Aug 1993.'
  text_sources:
  - SRC-0072
- id: CASE-BULANKULAMA-2000
  application_no: SC (FR) Application No. 884/99
  bench:
  - Amerasinghe J
  - Wadugodapitiya J
  - Gunasekera J
  material_facts: Residents of the Eppawela area challenged a proposed mineral investment agreement between the State and
    a foreign company for large-scale phosphate mining, which would displace residents and affect land, water and archaeological
    sites.
  legal_issues:
  - Can a proposed (not yet concluded) agreement amount to an imminent infringement of fundamental rights?
  - What is the State's responsibility in disposing of natural resources?
  decision: Imminent infringement of the petitioners' fundamental rights established; the State directed to desist from entering
    into the agreement until environmental and other legal requirements were met.
  ratio: A proposed agreement threatening fundamental rights may be restrained as an imminent infringement under Art 126;
    the organs of State are guardians to whom the People have committed the care and preservation of their resources, so the
    disposal of natural resources must respect environmental law and sustainable development (balancing the needs of present
    and future generations). Amerasinghe J found the US public trust doctrine comparatively restrictive and preferred an indigenous
    concept of shared responsibility and guardianship.
  obiter:
  - Stockholm Principles and Rio Principle 15 (precautionary approach) used as guides though not binding instruments; the
    judgment refers to future generations but does not use the phrase 'intergenerational equity'.
  principles:
  - State as guardian of natural resources
  - Sustainable development
  - Precautionary approach (Rio 15)
  - Future generations
  - Imminent infringement under Art 126
  subsequent_treatment: Cited in later SC decisions on public trust (2008 judgment; Azath Salley v CMC [2009] 1 Sri LR) -
    details pending.
  field_status:
