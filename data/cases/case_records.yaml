- id: CASE-SAMAN-LEELADASA-1989
  application_no: S.C. Application No. 4/88
  bench:
  - Ranasinghe CJ
  - Fernando J
  - Amerasinghe J
  material_facts: A remand prisoner was struck with a baton by a prison guard (1st respondent) for not obeying an order not
    to bathe at a tank near his cell, suffering a fractured left arm; he was hospitalised in the remand prison until release
    on 11 Dec 1987 and filed on 7 Jan 1988.
  legal_issues:
  - When is the State liable for FR infringements committed by its officers?
  decision: Art 11 infringed; the State to pay Rs 15,000 compensation (Amerasinghe J, Ranasinghe CJ agreeing); Fernando J
    would have held the 1st respondent and the State jointly and severally liable. Superior prison officers not liable (decided
    12 Dec 1988).
  ratio: An act is executive or administrative action under Art 126 if done in the performance or purported performance of
    official duties, irrespective of rank; an unauthorised or prohibited act incidental to the officer's employment and done
    in the course of the State's business counts, but superior officials are not vicariously liable for subordinates. The
    one-month limit does not run while the petitioner is unable to act (lex non cogit ad impossibilia).
  obiter: []
  principles:
  - Executive or administrative action
  - State liability for FR violations by officers
  - Computation of the one-month time limit
  subsequent_treatment: Cited 1991 onward on compensation; pin-page variants (1, 7, 10).
  field_status:
    ratio: verified_primary
    material_facts: verified_primary
    decision: verified_primary
    application_no: verified_primary
    decided_on: verified_primary
    bench: verified_primary
  edges: []
  decided_on: '1988-12-12'
  verification_note: 'RESOLVED (earlier note asked to confirm officer vs State liability): Amerasinghe J (Ranasinghe CJ agreeing)
    - State liable to pay Rs 15,000; Fernando J - 1st respondent and State jointly and severally liable. Decided 12 Dec 1988;
    reported [1989] 1 Sri LR 1.'
  text_sources:
  - SRC-0057
- id: CASE-FAIZ-1995
  application_no: SC Application No. 89/91
  bench:
  - Fernando J
  - Goonewardene J
  - Perera J
  material_facts: On 26 April 1991 the petitioner was arrested and detained overnight at a police station in connection with
    illicit felling; inside the station he was assaulted by private persons (5th-7th respondents) while the police failed
    to intervene, and no action was later taken against them.
  legal_issues:
  - Did the arrest, detention and treatment infringe Arts 11, 13(1) and 13(2)?
  decision: Arts 11, 12(1), 13(1) and 13(2) infringed (Goonewardene J dissenting on Art 13(2)); private respondents held responsible
    together with police officers; total compensation Rs 50,000 and costs Rs 5,000, apportioned (decided 19 Nov 1993).
  ratio: 'Art 126 asks whether the infringement was by executive or administrative action, not whether the actor was an executive
    officer: a private act becomes executive action when done with executive authority, express or implied from approval,
    instigation, connivance, acquiescence, participation or inaction where there is a duty to act; responsibility extends
    to non-executive respondents guilty of impropriety or connivance with the executive (per Fernando J; headnote holdings
    5-7).'
  obiter: []
  principles:
  - Private acts as executive action (connivance, acquiescence)
  - Equal protection by inaction
  - Arrest under the CCP
  subsequent_treatment: Cited 1999 at p. 383 on suspension of public servant (proposition pending).
  field_status:
    decision: verified_primary
    ratio: verified_primary
    material_facts: verified_primary
    application_no: verified_primary
    decided_on: verified_primary
    bench: verified_primary
  edges: []
  decided_on: '1993-11-19'
  verification_note: 'CORRECTION OF A PHASE 2 DOWNGRADE: the ''State authority, connivance or acquiescence'' proposition is
    CONFIRMED from the text (headnote holdings 5-7 and per Fernando J). Goonewardene J dissented on the Art 13(2) detention
    point. Decided 19 Nov 1993; total Rs 50,000 compensation and Rs 5,000 costs, apportioned among respondents.'
  text_sources:
  - SRC-0066
- id: CASE-NANAYAKKARA-CHOKSY-2008
  application_no: SC FR 209/2007
  bench:
  - S. N. Silva CJ
  - Amaratunga J
  - Balapatabendi J
  material_facts: PERC Chairman P. B. Jayasundera caused the sale of 90% of the shares of Lanka Marine Services Ltd (a profitable,
    debt-free CPC subsidiary) to John Keells Holdings without Cabinet approval or a Government Valuer's valuation, followed
    by a State land grant, a BOI tax-free agreement and a common-user facility clause conferring a bunkering monopoly.
  legal_issues:
  - Did the privatisation process violate Art 12(1)?
  - Is a public-interest petitioner entitled to bring it?
  - What relief is just and equitable where executive action is partly severable?
  decision: Art 12(1) infringed in respect of the sale of 90% of LMSL shares; JKH held to have secured benefits through an
    illegal process; relief moulded under Art 126 on the basis of severability (21 July 2008).
  ratio: Executive action in disposing of State enterprises without lawful authority, in a non-transparent and biased process,
    violates the equal protection of the law; a public-interest petitioner has standing; the Court may mould just and equitable
    relief by severing the impugned executive action instead of restoring the status quo ante.
