records:
  - id: CASE-LIYANAGE-1965
    application_no: "Privy Council Appeal (Ceylon)"
    bench: []
    material_facts: "After the abortive coup of January 1962, Parliament enacted the Criminal Law (Special Provisions) Act 1962, applying retrospectively to the accused, altering rules of evidence, arrest and punishment, and providing for trial by judges nominated by the Minister of Justice. The appellants were convicted by a Supreme Court bench constituted under the Act."
    legal_issues:
      - "Did the Soulbury Constitution, though silent, vest judicial power exclusively in the judicature?"
      - "Was legislation directed at the particular accused in pending proceedings a usurpation of judicial power?"
    decision: "Convictions quashed; the impugned legislation was ultra vires as an interference with judicial power."
    ratio: "The structure of the Constitution implies a separation of judicial power; legislation that is ad hominem and designed to secure the conviction of particular persons in pending proceedings usurps that power and is invalid."
    obiter: []
    principles: ["Implied separation of powers", "Judicial power cannot be usurped by legislature or executive"]
    subsequent_treatment: "Relied on by Ceylon courts to hold that executive officers cannot exercise judicial power; foundational to S-CON-03."
    field_status: {material_facts: unverified, ratio: corroborated, application_no: unverified}
    edges: []

  - id: CASE-PREMACHANDRA-1994
    application_no: "SC References 2/93 and 3/93"
    bench: ["G.P.S. de Silva CJ", "Bandaranayake J", "Fernando J"]
    material_facts: "Rival claims to appointment as Chief Minister made to the Governors of two provinces after provincial council elections; the Governors' appointments were challenged."
    legal_issues:
      - "Is the Governor's power to appoint a Chief Minister under Art 154F an unreviewable discretion?"
    decision: "Governors' discretion held subject to legal limits and judicial review (orders: pending verification)."
    ratio: "Every power has legal limits however wide the empowering language; there are no absolute or unfettered discretions in public law, and powers are held in trust for the public."
    obiter: []
    principles: ["No unfettered discretion", "Public trust in exercise of public power"]
    subsequent_treatment: "Cited in later SC decisions on public trust (e.g. alongside Bulankulama in a 2008 judgment) and at pp. 101-102 for discretion."
    field_status: {decision: unverified, ratio: corroborated}
    edges: []

