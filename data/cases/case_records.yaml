    challenged under Art 121(1).
  legal_issues:
  - Does reallocation of executive powers between organs require a referendum under Arts 3, 4 and 83?
  decision: Clauses inconsistent with Art 4(b) required approval at a referendum; substituted clauses could pass by special
    majority under Art 84(2).
  ratio: 'Art 3 read with Art 4: transfer, relinquishment or removal of a power attributed to one organ of government to another
    organ or body is inconsistent with the sovereignty of the People.'
