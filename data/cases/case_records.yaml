- id: CASE-RE-13A-1987
  application_no: S.C. 7/87 (Spl) to S.C. 48/87 (Spl); S.D. Nos. 1/87 and 2/87 (Presidential reference and Art 121 petitions)
  bench:
  - Sharvananda CJ
  - Wanasundera J
  - Colin-Thome J
  - Ranasinghe J
  - Atukorale J
  - Tambiah J
  - L. H. de Alwis J
  - Seneviratne J
  - H. A. G. de Silva J
  material_facts: Following the Indo-Lanka Accord (July 1987), the Thirteenth Amendment Bill and Provincial Councils Bill
    were challenged under Art 121 as requiring a referendum because they would alter the unitary State.
  legal_issues:
  - Does devolution to provincial councils violate the unitary State (Art 2) or sovereignty (Art 3), so requiring a referendum
    under Art 83?
  decision: 'Majority (Sharvananda CJ, Colin-Thome, Atukorale, Tambiah JJ): neither Bill required a referendum under Art 83.
    Ranasinghe J agreed save that proposed Art 154G(2)(b) and (3)(b) required a referendum. Wanasundera, L. H. de Alwis, Seneviratne
    and H. A. G. de Silva JJ dissented: both Bills in their totality required a referendum.'
  ratio: The unitary character of the State (supremacy of the central Parliament and absence of subsidiary sovereign bodies)
    is unaffected where Provincial Councils exercise only limited legislative power subordinate to Parliament; devolution
    is delegation without relinquishing supremacy and is not an abdication or alienation of legislative power.
  obiter: []
  principles:
  - Devolution compatible with unitary State
  subsequent_treatment: Treated as settling that 13A devolution is within a unitary framework (CPA Working Paper 1).
  field_status:
    ratio: verified_primary
    bench: verified_primary
    decision: verified_primary
    application_no: verified_primary
  edges: []
  verification_note: 'RESOLVED lettering: the judgment text refers to clause 154G(2)(b) and (3)(b) (the headnote OCR drops
    the G). Hearings 22-30 Oct 1987. Effectively a 5-4 division on the referendum question.'
  text_sources:
  - SRC-0047
